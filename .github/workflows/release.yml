name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Build the deck
        run: uv run total-history deck

      - name: Publish release
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || echo "The Anki deck built from the data in this commit." > "$notes"
          gh release create "$GITHUB_REF_NAME" build/*.apkg \
            --title "Total History ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes" \
            --verify-tag
